name: Daily Resume Upload to Naukri

on:
  schedule:
    # Runs daily at 11:55 PM IST (18:25 UTC)
    - cron: '25 18 * * *'
  workflow_dispatch:  # Allows manual trigger for testing

jobs:
  upload-resume:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg unzip
        
    - name: Install Google Chrome and ChromeDriver
      run: |
        # Install Chrome
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        # Get Chrome version
        CHROME_VERSION=$(google-chrome --version | cut -d ' ' -f3 | cut -d '.' -f1-3)
        echo "Chrome version: $CHROME_VERSION"
        
        # Download and install matching ChromeDriver
        CHROMEDRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION")
        echo "ChromeDriver version: $CHROMEDRIVER_VERSION"
        
        wget -O /tmp/chromedriver.zip "https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip"
        sudo unzip /tmp/chromedriver.zip -d /usr/bin/
        sudo chmod +x /usr/bin/chromedriver
        
    - name: Verify installations
      run: |
        google-chrome --version
        chromedriver --version
        which chromedriver
        
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Verify resume file exists
      run: |
        ls -la
        if [ ! -f "Ayush Aryan.pdf" ]; then
          echo "❌ Resume file not found!"
          exit 1
        fi
        echo "✅ Resume file found: $(ls -lh 'Ayush Aryan.pdf')"
        
    - name: Run resume upload script
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        GITHUB_ACTIONS: true
      run: |
        echo "🚀 Starting resume upload automation..."
        python resume_upload.py
        
    - name: Upload logs and screenshots on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-logs-${{ github.run_number }}
        path: |
          *.log
          *.png
        retention-days: 5
