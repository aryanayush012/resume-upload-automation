name: Daily Resume Upload (Alternative)

on:
  schedule:
    - cron: '25 18 * * *'
  workflow_dispatch:

jobs:
  upload-resume:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    # Try using a different browser setup
    - name: Setup Firefox instead of Chrome
      uses: browser-actions/setup-firefox@v1
      
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install selenium==4.15.2 requests beautifulsoup4
        
    - name: Try with Firefox (alternative)
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        GITHUB_ACTIONS: true
      run: |
        python -c "
        from selenium import webdriver
        from selenium.webdriver.firefox.options import Options
        import time
        
        options = Options()
        options.add_argument('--headless')
        
        driver = webdriver.Firefox(options=options)
        driver.get('https://www.naukri.com/nlogin/login')
        print('Firefox Page Title:', driver.title)
        driver.quit()
        "
        
    - name: Run main script with enhanced bypass
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        GITHUB_ACTIONS: true
      run: python resume_upload.py
      
    - name: Upload debug files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-files-${{ github.run_number }}
        path: "*.png"
        retention-days: 5
