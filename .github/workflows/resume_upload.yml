name: Daily Resume Upload to Naukri

on:
  schedule:
    # Runs daily at 11:55 PM IST (18:25 UTC)
    - cron: '25 18 * * *'
  workflow_dispatch:  # Allows manual trigger for testing

jobs:
  upload-resume:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Setup Chrome and ChromeDriver
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
        
    - name: Verify Chrome installation
      run: |
        google-chrome --version
        chromedriver --version
        which chromedriver
        
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Verify resume file exists
      run: |
        ls -la
        if [ ! -f "Ayush Aryan.pdf" ]; then
          echo "❌ Resume file not found!"
          exit 1
        fi
        echo "✅ Resume file found: $(ls -lh 'Ayush Aryan.pdf')"
        
    - name: Run resume upload script
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        GITHUB_ACTIONS: true
      run: |
        echo "🚀 Starting resume upload automation..."
        python resume_upload.py
        
    - name: Upload logs and screenshots on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-logs-${{ github.run_number }}
        path: |
          *.log
          *.png
        retention-days: 5
